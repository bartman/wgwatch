name: ci

on:
  push:
  pull_request:

jobs:
  debian:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      - uses: actions/checkout@v5
      - run: ./dependencies.sh
      - run: make
      - run: make test
      - run: make deb
      - run: dpkg -i build/*.deb
      - run: wgwatch --help
      - uses: actions/upload-artifact@v5
        with:
          name: wgwatch-deb
          path: build/*.deb

  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v5
      - run: ./dependencies.sh
      - run: make
      - run: make test
      - run: make rpm
      - run: dnf install -y ./build/*.rpm
      - run: wgwatch --help
      - uses: actions/upload-artifact@v5
        with:
          name: wgwatch-rpm
          path: build/*.rpm

  coverage:
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      - uses: actions/checkout@v5
      - run: ./dependencies.sh --coverage
      - run: make coverage
      - uses: actions/upload-artifact@v5
        with:
          name: wgwatch-coverage
          path: build-cov/coverage.lcov
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  nix-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix develop --command bash -c 'make && make test'

  nix-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build .#default
      - run: ./result/bin/wgwatch --help

  release:
    needs: [debian, fedora]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: wgwatch-deb
      - uses: actions/download-artifact@v5
        with:
          name: wgwatch-rpm
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm
